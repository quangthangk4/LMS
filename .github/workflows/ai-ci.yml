name: AI CI

on:
  push:
    branches: [main]
    paths:
      - 'LMS_AI/**'
      - '.github/workflows/ai-*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'LMS_AI/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: chatbot_test
          POSTGRES_USER: chatbot_test
          POSTGRES_PASSWORD: chatbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatbot_test -d chatbot_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CHATBOT_TEST_DATABASE_URL: postgresql://chatbot_test:chatbot_test@localhost:5432/chatbot_test
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./LMS_AI

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            ./LMS_AI/requirements.txt
            ./LMS_AI/Dockerfile

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.2.2+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall api_service.py worker.py ai_etl ai_gateway scripts tests

      - name: Run contract and regression tests
        run: python -m pytest -q
